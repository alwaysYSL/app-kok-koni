name: kok_app
description: Frontend KOK KONI Garut untuk pemantauan olahraga kecamatan.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: KokSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
