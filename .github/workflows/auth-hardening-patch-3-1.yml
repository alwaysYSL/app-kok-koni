name: Auth hardening Patch 3.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/auth-hardening-patch-3-1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Record tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Freezed and JSON sources
        run: flutter pub run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android debug artifact
        run: flutter build apk --debug

      - name: Reject active SICABOR claims in app source
        shell: bash
        run: |
          if git grep -nEi 'ID SICABOR|Data milik SICABOR|SINKRONISASI DATA SICABOR|tersinkronisasi dengan SICABOR|data SICABOR aktif' -- lib; then
            echo 'Active SICABOR claim found in lib/.'
            exit 1
          fi

      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: kok-app-patch-3-1-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
